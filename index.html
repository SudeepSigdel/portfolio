<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Primary Meta Tags -->
    <title>Sudeep Sigdel - API Developer & Backend Engineer</title>
    <meta name="title" content="Sudeep Sigdel - API Developer & Backend Engineer">
    <meta name="description" content="Sudeep Sigdel is a backend developer specializing in API development and system architecture. Professionally confused but optimistic!">
    <meta name="keywords" content="Sudeep Sigdel, API Developer, Backend Engineer, Software Developer, System Architecture">
    <meta name="author" content="Sudeep Sigdel">
    <meta name="robots" content="index, follow">
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://sudeepsigdel.com.np">
    <meta property="og:title" content="Sudeep Sigdel - API Developer & Backend Engineer">
    <meta property="og:description" content="Sudeep Sigdel is a backend developer specializing in API development and system architecture.">
    <meta property="og:image" content="https://sudeepsigdel.com.np/public/assets/Sudeep.png">
    
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="public/assets/fav-sudeep.png">
    
    <!-- Stylesheet -->
    <link rel="stylesheet" href="style.css">
    
    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "name": "Sudeep Sigdel",
      "jobTitle": "API Developer & Backend Engineer",
      "description": "Backend developer specializing in API development and system architecture",
      "url": "https://sudeepsigdel.com.np",
      "email": "sudeepsigdel123@gmail.com",
      "sameAs": [
        "https://github.com/SudeepSigdel",
        "https://www.linkedin.com/in/sudeepsigdel/"
      ]
    }
    </script>
</head>

<body>
    <div class="content">
        <div class="photo">
            <img src="public/assets/Sudeep.png" alt="sudeep's back">
        </div>
        <div class="my-name">
            <span id="name">&nbsp;</span>
        </div>
        <div class="slogan">
            <p>backend engineer based in Nepal</p>
        </div>
        <div class="what-I-do">
            <p>i make APIs that make or break systems</p>
        </div>
        <script src="script.js"></script>
        <div class="links">
            <a href="https://github.com/SudeepSigdel" target="_blank" rel="noopener noreferrer">
                <img src="public/assets/github-icon.svg" alt="Github">
            </a>
            <a href="mailto:mail@sudeepsigdel.com.np" target="_blank" rel="noopener noreferrer">
                <img src="public/assets/email-icon.svg" alt="Mail">
            </a>
            <a href="https://www.linkedin.com/in/sudeepsigdel/" target="_blank" rel="noopener noreferrer">
                <img src="public/assets/linkedin-icon.svg" alt="LinkedIn">
            </a>
        </div>
        <div class="action-row">
            <button id="aboutme" onclick="openTerminal()">
                About Me <span class="blink-cursor">_</span>
            </button>
            <a id="resume-link" href="public/assets/Sudeep_CV.pdf" download="Sudeep_Sigdel_CV.pdf">Resume</a>
        </div>
        <p class="terminal-hint">opens a live API terminal</p>
    </div>

    <div class="terminal-overlay" id="terminalOverlay" aria-hidden="true">
        <div class="terminal-window" role="dialog" aria-modal="true" aria-label="Live API terminal">
            <div class="terminal-titlebar">
                <span class="terminal-dot red"></span>
                <span class="terminal-dot yellow"></span>
                <span class="terminal-dot green"></span>
                <span class="terminal-titletext">sudeep@api:~</span>
                <button class="terminal-close" id="terminalClose" aria-label="Close terminal">&times;</button>
            </div>
            <div class="terminal-body" id="terminalBody"></div>
            <div class="terminal-inputline">
                <span class="prompt">sudeep@api:~$</span>
                <input type="text" id="terminalInput" autocomplete="off" spellcheck="false" aria-label="Terminal command input">
            </div>
        </div>
    </div>

    <script src="terminal.js"></script>
</body>

</html>
