<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @keyframes float1 {
        0%, 100% { transform: translateX(0) translateY(0); }
        50% { transform: translateX(20px) translateY(-30px); }
      }

      @keyframes float2 {
        0%, 100% { transform: translateX(0) translateY(0); }
        50% { transform: translateX(-25px) translateY(35px); }
      }

      @keyframes float3 {
        0%, 100% { transform: translateX(0) translateY(0); }
        50% { transform: translateX(30px) translateY(20px); }
      }

      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      @keyframes pulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.2); }
      }

      @keyframes drift {
        0%, 100% { transform: translateX(0) translateY(0) rotate(0deg); }
        50% { transform: translateX(-15px) translateY(25px) rotate(180deg); }
      }

      .anim1 { animation: float1 6s ease-in-out infinite; }
      .anim2 { animation: float2 7s ease-in-out infinite; }
      .anim3 { animation: float3 8s ease-in-out infinite; }
      .spin { animation: spin 5s linear infinite; }
      .pulse { animation: pulse 4s ease-in-out infinite; }
      .drift { animation: drift 6s ease-in-out infinite; }
      
      .anim1, .anim2, .anim3, .spin, .pulse, .drift {
        transform-box: fill-box;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="#f8fafc"/>

  <!-- Grid pattern -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#e2e8f0" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="800" height="600" fill="url(#grid)" />

  <!-- Top left area -->
  <g transform="translate(80, 80)">
    <circle class="anim1" r="25" fill="#ff6b6b" opacity="0.6"/>
  </g>

  <g transform="translate(150, 120)">
    <rect class="spin" x="-15" y="-15" width="30" height="30" fill="none" stroke="#4ecdc4" stroke-width="2" opacity="0.5"/>
  </g>

  <g transform="translate(100, 180)">
    <polygon class="pulse" points="0,-18 18,0 0,18 -18,0" fill="#ffd93d" opacity="0.6"/>
  </g>

  <!-- Top right area -->
  <g transform="translate(680, 90)">
    <circle class="anim2" r="30" fill="#a8e6cf" opacity="0.6"/>
  </g>

  <g transform="translate(600, 130)">
    <polygon class="drift" points="0,-20 12,-6 7,16 -7,16 -12,-6" fill="#ff8c42" opacity="0.5"/>
  </g>

  <g transform="translate(720, 180)">
    <circle class="anim3" r="18" fill="#c7b3ff" opacity="0.6"/>
  </g>

  <!-- Bottom left area -->
  <g transform="translate(90, 480)">
    <rect class="pulse" x="-20" y="-20" width="40" height="40" fill="none" stroke="#764ba2" stroke-width="2" opacity="0.5"/>
  </g>

  <g transform="translate(160, 520)">
    <circle class="anim1" r="22" fill="#f093fb" opacity="0.6"/>
  </g>

  <g transform="translate(120, 540)">
    <polygon class="spin" points="0,-16 14,8 -14,8" fill="#89d4cf" opacity="0.5"/>
  </g>

  <!-- Bottom right area -->
  <g transform="translate(680, 500)">
    <circle class="anim3" r="28" fill="#ff9a9e" opacity="0.6"/>
  </g>

  <g transform="translate(730, 540)">
    <rect class="drift" x="-18" y="-18" width="36" height="36" fill="#feca57" opacity="0.5"/>
  </g>

  <g transform="translate(620, 520)">
    <polygon class="anim2" points="0,-15 4,-5 14,-4 6,3 9,12 0,7 -9,12 -6,3 -14,-4 -4,-5" fill="#778beb" opacity="0.5"/>
  </g>

  <!-- Left side scattered -->
  <g transform="translate(70, 250)">
    <circle class="pulse" r="15" fill="#e056fd" opacity="0.6"/>
  </g>

  <g transform="translate(120, 320)">
    <polygon class="anim1" points="0,-22 20,-7 12,18 -12,18 -20,-7" fill="#48dbfb" opacity="0.5"/>
  </g>

  <g transform="translate(90, 380)">
    <circle class="spin" r="20" fill="none" stroke="#ff9ff3" stroke-width="2" opacity="0.5"/>
  </g>

  <!-- Right side scattered -->
  <g transform="translate(720, 280)">
    <rect class="anim2" x="-16" y="-16" width="32" height="32" fill="#55efc4" opacity="0.5"/>
  </g>

  <g transform="translate(680, 360)">
    <circle class="drift" r="24" fill="#fab1a0" opacity="0.6"/>
  </g>

  <g transform="translate(740, 420)">
    <polygon class="pulse" points="0,-12 3,-4 11,-3 5,2 7,10 0,6 -7,10 -5,2 -11,-3 -3,-4" fill="#81ecec" opacity="0.5"/>
  </g>

  <!-- Mid-top scattered (avoiding center) -->
  <g transform="translate(280, 100)">
    <circle class="anim3" r="16" fill="#fdcb6e" opacity="0.6"/>
  </g>

  <g transform="translate(520, 120)">
    <polygon class="spin" points="0,-14 12,7 -12,7" fill="none" stroke="#e17055" stroke-width="2" opacity="0.5"/>
  </g>

  <g transform="translate(350, 140)">
    <rect class="pulse" x="-12" y="-12" width="24" height="24" fill="#6c5ce7" opacity="0.5"/>
  </g>

  <!-- Mid-bottom scattered (avoiding center) -->
  <g transform="translate(240, 480)">
    <circle class="anim1" r="19" fill="#ff7675" opacity="0.6"/>
  </g>

  <g transform="translate(320, 520)">
    <polygon class="drift" points="0,-16 16,0 0,16 -16,0" fill="#00b894" opacity="0.5"/>
  </g>

  <g transform="translate(480, 500)">
    <circle class="anim2" r="17" fill="#0984e3" opacity="0.6"/>
  </g>

  <g transform="translate(560, 540)">
    <rect class="spin" x="-14" y="-14" width="28" height="28" fill="none" stroke="#d63031" stroke-width="2" opacity="0.5"/>
  </g>

  <!-- Additional small elements -->
  <g transform="translate(220, 200)">
    <circle class="pulse" r="10" fill="#fdcb6e" opacity="0.5"/>
  </g>

  <g transform="translate(580, 220)">
    <circle class="anim3" r="12" fill="#00cec9" opacity="0.5"/>
  </g>

  <g transform="translate(260, 380)">
    <rect class="drift" x="-8" y="-8" width="16" height="16" fill="#e84393" opacity="0.5"/>
  </g>

  <g transform="translate(540, 400)">
    <circle class="spin" r="11" fill="#fab1a0" opacity="0.5"/>
  </g>

  <g transform="translate(200, 290)">
    <polygon class="anim1" points="0,-10 10,0 0,10 -10,0" fill="#dfe6e9" opacity="0.5"/>
  </g>

  <g transform="translate(600, 320)">
    <circle class="anim2" r="13" fill="#74b9ff" opacity="0.5"/>
  </g>
</svg>